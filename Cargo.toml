[workspace]
resolver = "3"
members = ["crates/gbc-core", "crates/gbc-desktop", "crates/gbc-firmware", "tools/bench", "tools/fuzz", "tools/headless", "tools/memory-x", "tools/romtest", "tools/sm83-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Panics must unwind: romtest catches them per ROM (acceptance/README.md).
# Never set `panic = "abort"` in these profiles.
[profile.release]
debug = "line-tables-only"
# One codegen unit, as the firmware build will use (human, 2026-11-24):
# with several, which functions are inlined, and so every size and Ir
# number in perf/, depends on how rustc splits the crate into units.
# The `checked` profile inherits it.
codegen-units = 1

# The SM83 test data (161 MB) is hashed on every `cargo test`; unoptimized
# SHA-256 would add seconds to the dev loop.
[profile.dev.package.sha2]
opt-level = 3

# Release optimizations with integer-overflow checks and `debug_assert!`s on:
# the gate's fuzz pass runs under it (scripts/check-fuzz.sh), so an
# arithmetic slip panics there instead of wrapping silently in release.
# `cargo <cmd> --profile checked`; output in target/checked/.
[profile.checked]
inherits = "release"
overflow-checks = true
debug-assertions = true
