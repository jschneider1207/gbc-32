# Stage 1 acceptance manifest.
#
# OWNED BY THE HUMAN. Agents must not edit this file (or any expected
# screenshot) without explicit approval. See acceptance/README.md for the
# format and the runner contract.
#
# All paths are relative to test-roms/ (populated by scripts/fetch-test-roms.sh).
# Target hardware: CPU CGB C (see docs/decisions/0003-target-cgb-revision.md).
#
# Every group encodes the pass/fail rules published upstream in
# test-roms/<suite>/game-boy-test-roms-howto.md (c-sp/game-boy-test-roms
# src/howto/<suite>.md @ v7.0): exit condition, run time, check type and
# expected screenshot. Each group cites its how-to in a `source` comment.
# One addition goes beyond upstream: Blargg cpu_instrs/instr_timing also
# require a `serial` check, because those ROMs print their results to the
# serial port, which lets CPU work be verified before the PPU exists.
#
# ROMs without the CGB flag run in DMG compatibility mode.
#
# Suites deliberately not included in Stage 1: bully, scribbltests,
# strikethrough, turtle-tests, little-things-gb, gbmicrotest,
# mooneye-test-suite-wilbertpol, blargg dmg_sound/oam_bug. They are DMG-only,
# duplicate coverage above, or have no CGB reference.

roms_release = "v7.0"
model = "cgb-c"

# ---------------------------------------------------------------- must ---

[[group]]
# source: blargg/game-boy-test-roms-howto.md
id = "blargg-cpu-instrs"
tier = "must"
roms = ["blargg/cpu_instrs/cpu_instrs.gb"]
exit = { run_s = 31 }
checks = [{ serial = "Passed all tests" }, { screenshot = "blargg/cpu_instrs/cpu_instrs-dmg-cgb.png" }]

[[group]]
# source: blargg/game-boy-test-roms-howto.md
id = "blargg-instr-timing"
tier = "must"
roms = ["blargg/instr_timing/instr_timing.gb"]
exit = { run_s = 1 }
checks = [{ serial = "Passed" }, { screenshot = "blargg/instr_timing/instr_timing-dmg-cgb.png" }]

[[group]]
# source: blargg/game-boy-test-roms-howto.md
id = "blargg-mem-timing"
tier = "must"
roms = ["blargg/mem_timing/mem_timing.gb"]
exit = { run_s = 3 }
checks = [{ screenshot = "blargg/mem_timing/mem_timing-dmg-cgb.png" }]

