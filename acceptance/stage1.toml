# Signed off (human, 2026-11-23, session 14): needs the CGB C PCM12 read
# glitch (its left digit; the asm says so). A model of it fitted to this
# ROM broke 14 passing SameSuite ch1/ch2 ROMs that expect CGB E reads, and
# no hardware capture pins the glitch down. We keep CGB E reads. Evidence:
# docs/reference/apu.md (PCM12/PCM34), docs/plan/m9-triage.md group 15.
[[group]]
# source: same-suite/game-boy-test-roms-howto.md
id = "same-suite-apu-pcm-glitch"
tier = "stretch"
roms = ["same-suite/apu/channel_1/channel_1_freq_change_timing-cgb0BC.gb"]
exit = { ld_b_b = true, timeout_s = 120 }
checks = [{ fibonacci = true }]

# Signed off (human, 2026-11-23): CGB E results; SameSuite apu/README:
# CPU-CGB-C fails most channel 1/2 tests. We follow gambatte cgb04c
# captures (ADR 0003: CPU CGB C). See docs/STATUS.md, session 11.
# Also signed off (human, 2026-11-23, session 12): the NRx2 glitch, LFSR
# and ch4 frequency ROMs below, as CGB E results (apu/README: the NRX2
# glitch is only tested on revision E; a PCM12/PCM34 read glitch on CGB C
# and older fails most ch1/2/4 tests; SameBoy has CGB-C-specific paths).
# Also signed off (human, 2026-11-23, session 15): ch1/2 volume, ch4
# align, ch1 sweep_restart, as CGB E results (each failing cell is
# SameBoy's CGB C value: nrx2 0xFF step, ds even-alignment +2, NR10
# old_negate).
# Evidence: docs/plan/m9-triage.md group 15.
