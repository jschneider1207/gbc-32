# Mooneye acceptance tests that run on every model (no model suffix),
# excluding PPU timing, which is tier "should" below.
[[group]]
# source: mooneye-test-suite/game-boy-test-roms-howto.md
id = "mooneye-acceptance"
tier = "must"
roms = ["mooneye-test-suite/acceptance/**/*.gb"]
exclude = ["mooneye-test-suite/acceptance/**/*-*.gb", "mooneye-test-suite/acceptance/ppu/**"]
exit = { ld_b_b = true, timeout_s = 120 }
checks = [{ fibonacci = true }]

[[group]]
# source: mooneye-test-suite/game-boy-test-roms-howto.md
id = "mooneye-mbc"
tier = "must"
roms = [
  "mooneye-test-suite/emulator-only/mbc1/*.gb",
  "mooneye-test-suite/emulator-only/mbc2/*.gb",
  "mooneye-test-suite/emulator-only/mbc5/*.gb",
]
exclude = ["mooneye-test-suite/emulator-only/mbc1/multicart_rom_8Mb.gb"]
exit = { ld_b_b = true, timeout_s = 120 }
checks = [{ fibonacci = true }]

[[group]]
# source: mooneye-test-suite/game-boy-test-roms-howto.md
id = "mooneye-cgb-boot-regs"
tier = "must"
roms = ["mooneye-test-suite/misc/boot_regs-cgb.gb"]
exit = { ld_b_b = true, timeout_s = 120 }
checks = [{ fibonacci = true }]

[[group]]
# source: rtc3test/game-boy-test-roms-howto.md (run time >= last menu press + documented duration + 2 s margin)
id = "rtc3test-basic"
tier = "must"
roms = ["rtc3test/rtc3test.gb"]
input = [{ at_s = 1.0, press = ["a"], hold_s = 0.1 }]
exit = { run_s = 16 }
checks = [{ screenshot = "rtc3test/rtc3test-basic-tests-cgb.png" }]

[[group]]
# source: rtc3test/game-boy-test-roms-howto.md (run time >= last menu press + documented duration + 2 s margin)
id = "rtc3test-range"
tier = "must"
roms = ["rtc3test/rtc3test.gb"]
input = [
  { at_s = 1.0, press = ["down"], hold_s = 0.1 },
  { at_s = 1.3, press = ["a"], hold_s = 0.1 },
]
exit = { run_s = 12 }
checks = [{ screenshot = "rtc3test/rtc3test-range-tests-cgb.png" }]

[[group]]
# source: rtc3test/game-boy-test-roms-howto.md (run time >= last menu press + documented duration + 2 s margin)
id = "rtc3test-sub-second"
tier = "must"
roms = ["rtc3test/rtc3test.gb"]
input = [
  { at_s = 1.0, press = ["down"], hold_s = 0.1 },
  { at_s = 1.3, press = ["down"], hold_s = 0.1 },
  { at_s = 1.6, press = ["a"], hold_s = 0.1 },
]
exit = { run_s = 30 }
checks = [{ screenshot = "rtc3test/rtc3test-sub-second-writes-cgb.png" }]

[[group]]
# source: mbc3-tester/game-boy-test-roms-howto.md
id = "mbc3-tester"
tier = "must"
roms = ["mbc3-tester/mbc3-tester.gb"]
exit = { run_frames = 40 }
checks = [{ screenshot = "mbc3-tester/mbc3-tester-cgb.png" }]

