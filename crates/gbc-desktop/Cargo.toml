[package]
name = "gbc-desktop"
description = "Desktop front end for gbc-core (Stage 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cpal = "0.18.2"
ctrlc = { version = "3.5.3", features = ["termination"] }
gbc-core = { path = "../gbc-core" }
gilrs = "0.11.2"
ringbuf = "0.6.0"
softbuffer = "0.4"
winit = "0.30"

# GBC_FRAME_LOG: DWM refresh timing (a query; no GPU use) and the QPC clock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_System_Performance"] }
