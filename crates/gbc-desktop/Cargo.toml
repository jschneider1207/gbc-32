[package]
name = "gbc-desktop"
description = "Desktop front end for gbc-core (Stage 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cpal = "0.18.2"
ctrlc = { version = "3.5.3", features = ["termination"] }
gbc-core = { path = "../gbc-core" }
# The real-time RTC sync on load (`gbc_firmware::save::Clock::sync`),
# shared with tools/gbc-pc (ADR 0040); src/save.rs also checks that the
# firmware's save images (Stage 2 M5) are byte for byte what this front
# end writes.
gbc-firmware = { path = "../gbc-firmware" }
gilrs = "0.11.2"
ringbuf = "0.6.0"
softbuffer = "0.4"
winit = "0.30"

# DWM refresh timing (a query; no GPU use) for phase-aware presents and
# GBC_FRAME_LOG, the QPC clock, and process CPU time for the stats.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Performance", "Win32_System_Threading"] }
