[package]
name = "gbc-link-board"
description = "Board side of the PC <-> board link, board-independent: the ROM loader and player link session servers (Stage 2, ADR 0043)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# gbc-link and gbc-firmware only, normal dependencies (ADR 0043);
# tests/hard_rules.rs enforces it. Both are no_std, so the board crate
# (thumbv7em) and the host tests (tools/gbc-pc) build this alike.
[dependencies]
gbc-firmware = { path = "../gbc-firmware" }
gbc-link = { path = "../gbc-link" }
