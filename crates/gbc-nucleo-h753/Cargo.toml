[package]
name = "gbc-nucleo-h753"
description = "NUCLEO-H753ZI board support and firmware images: bring-up at 472 MHz, UART, MPU, caches, TCM copy, fault handlers (ADR 0036)"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

# Not a member of the root workspace: it only builds for thumbv7em and has
# its own profile and rustflags (.cargo/config.toml), as tools/h7-bench.
# Root `cargo test --workspace` never builds it for the host (ADR 0036).
[workspace]

# No host test harness: thumbv7em has no `test` crate, so `cargo clippy
# --all-targets` would fail on the test targets.
[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "boot"
test = false
bench = false

# The shield's QSPI NOR, read commands only (plan Stage 2 M2); built
# without features, as `boot`.
[[bin]]
name = "qspi-probe"
test = false
bench = false

# The NOR in memory-mapped mode: checks against indirect reads, latency,
# and the MPU fault test (plan Stage 2 M2); built as `boot`.
[[bin]]
name = "qspi-mmap"
test = false
bench = false

# The NOR write side and UART receive: erases and programs only the
# NOR's last 64 KiB block, then echoes the UART (plan Stage 2 M2); built
# as `boot`.
[[bin]]
name = "qspi-write"
test = false
bench = false

# The ROM loader: receives a ROM over the VCP (gbc-link) into the NOR
# (plan Stage 2 M2 "Loader", ADR 0038); built as `boot`.
[[bin]]
name = "loader"
test = false
bench = false

# First contact with the shield's ILI9341V panel over the FMC: IDs,
# timed fills and a full GRAM readback per FMC timing (plan Stage 2 M3);
# built as `boot`.
[[bin]]
name = "lcd-probe"
test = false
bench = false

# The frame path: MDMA from the AXI buffer to the panel on TE, readback
# per frame, TE and frame-rate tuning, then a test image (plan Stage 2
# M3); built as `boot`.
[[bin]]
name = "lcd-dma-probe"
test = false
bench = false

# Built only with `--features headless` (build.sh), which also selects the
# ITCM set in build.rs; see the feature.
[[bin]]
name = "headless"
required-features = ["headless"]
test = false
bench = false

# The placement is per build, not per bin: every bin of a package shares
# one build script and so one memory.x (ADR 0036). The `headless` feature
# turns on the ITCM set of perf/itcm-sections.txt (the M6-target
# `itcm-dtcm` placement) and the ROM embedding; `boot` links no gbc-core,
# so it is built without it (the set would leave `.itcm` nearly empty and
# fail its ASSERT). build.sh builds `--bin boot` and `--bin headless
# --features headless` separately.
#
# `rom-qspi` (implies `headless`): the same `headless` bin with its ROM read
# from the QSPI NOR window (an ADR 0037 image the loader put there) instead
# of embedded in internal flash. build.rs then embeds no ROM, so one image
# runs whatever ROM is loaded (build.sh: out/headless-qspi.bin).
[features]
headless = ["dep:gbc-core"]
rom-qspi = ["headless"]
# `display` (implies `headless`): the same image with the panel in the
# loop: each frame scaled, sent by MDMA and read back (plan Stage 2 M3;
# build.sh: out/headless-display-<rom>.bin).
display = ["headless"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Exact versions: the same as tools/h7-bench's Cargo.lock, so the two
# workspaces cannot resolve the PAC or the runtime differently (ADR 0036,
# Consequences). h7-bench will depend on this lib, which then forces them.
[dependencies]
cortex-m = "=0.7.10"
# `paint-stack`: the startup code fills the unused stack with 0xCCCCCCCC, so
# `stack::usage` can say how deep it went.
cortex-m-rt = { version = "=0.7.7", features = ["paint-stack"] }
# PAC only, no HAL: the H753 register description for silicon revision V
# (RM0433). Its default `rt` feature gives cortex-m-rt the interrupt
# vector table.
stm32h7 = { version = "=0.15.1", features = ["stm32h753v"] }
# The emulator and the headless loop (ADR 0036), for the `headless` image.
gbc-core = { path = "../gbc-core", optional = true }
# The image header (ADR 0037) for the loader, and the headless loop.
gbc-firmware = { path = "../gbc-firmware" }
# The PC <-> board protocol, for the loader (ADR 0036).
gbc-link = { path = "../gbc-link" }

# The memory.x generator (ADR 0036), shared with tools/h7-bench.
[build-dependencies]
memory-x = { path = "../../tools/memory-x" }

# As the root workspace's release profile (root Cargo.toml): default
# opt-level 3, one codegen unit, no LTO (perf/itcm-sections.txt and the
# sizes in docs/perf.md are measured that way).
[profile.release]
debug = "line-tables-only"
codegen-units = 1
