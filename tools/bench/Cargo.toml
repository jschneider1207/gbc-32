[package]
name = "bench"
description = "Instruction-count benchmark target (run via scripts/check-bench.sh under valgrind)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gbc-core = { path = "../../crates/gbc-core" }

# Test-only core hooks, for scripts/check-sync-invariance.sh (docs/perf.md
# "Invariance checks"). Never enabled for a measured or product build.
[features]
eager-sync = ["gbc-core/eager-sync"]
clock-offset = ["gbc-core/clock-offset"]
