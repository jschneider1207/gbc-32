[package]
name = "gbc-pc"
description = "PC companion for the dev board: ROM and save transfer and live input over the ST-LINK VCP (Stage 2 M2, M5)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gbc-link = { path = "../../crates/gbc-link" }
# The save check and the RTC sync on load / restamp on dump (src/rtc.rs,
# ADR 0040): the desktop's rule, shared. no_std, depends on gbc-core only.
gbc-firmware = { path = "../../crates/gbc-firmware" }
# `sim` only (test support, never in the exe).
gbc-link-board = { path = "../../crates/gbc-link-board", optional = true }

# Direct Win32 COM-port access (plan D9: windows-sys, MIT/Apache-2.0; not
# the MPL-2.0 `serialport` crate).
# tests/rtc.rs stands in for the board with a real core (load, clock,
# take).
[dev-dependencies]
gbc-core = { path = "../../crates/gbc-core" }
# tests/board.rs and tests/link_session.rs run the client against the
# board's real servers (ADR 0043).
gbc-link-board = { path = "../../crates/gbc-link-board" }
# The simulated board (`sim`) is test support and stays out of the exe; the
# tests turn it on through this self dependency, so a plain
# `cargo test -p gbc-pc` needs no flags (Q15).
gbc-pc = { path = ".", features = ["sim"] }

[features]
# The simulated board uses the board's own resend logic (ADR 0043).
sim = ["dep:gbc-link-board"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Communication", "Win32_Media_Audio", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
