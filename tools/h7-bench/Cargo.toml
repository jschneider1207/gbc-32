[package]
name = "h7-bench"
description = "NUCLEO-H753ZI (or NUCLEO-H755ZI-Q) measurement spike: Cortex-M7 cycles per emulated frame"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

# Not a member of the root workspace: it only builds for thumbv7em and has
# its own profile and rustflags (.cargo/config.toml). `host/` (the expected
# hashes, built for the PC) is a third workspace for the same reason.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
# The board (README "Boards"); exactly one. build.sh picks it from
# H7_BENCH_BOARD (default h753) and passes --no-default-features.
default = ["h753"]
# NUCLEO-H753ZI (MB1364, STM32H753ZIT6): single core, LDO supply.
h753 = ["stm32h7/stm32h753v"]
# NUCLEO-H755ZI-Q (MB1363, STM32H755ZIT6): dual core, direct SMPS supply.
h755 = ["stm32h7/stm32h747cm7"]
# Placement (README "Placements"). None: code in flash, data in AXI SRAM.
# Stack, statics and the core's lookup tables in DTCM.
dtcm = []
# The hot set of perf/itcm-sections.txt in ITCM (needs `dtcm`).
itcm = ["dtcm"]
# Phase B clock: PLL1 from HSI, 392 MHz CPU at VOS1. Off by default (phase
# A: the 64 MHz HSI the chip resets to, no clock setup at all).
pll = []
# Board bring-up only: power, clock, UART, LEDs, cycle counter. No emulator.
selftest = []
# QEMU mps2-an500 smoke run of the frame loop and hashes (semihosting
# output, no board code). With `itcm` it also exercises the placement.
qemu = ["dep:cortex-m-semihosting"]

[dependencies]
gbc-core = { path = "../../crates/gbc-core" }
cortex-m = "0.7.7"
# `paint-stack`: the startup code fills the unused stack with 0xCCCCCCCC, so
# the report can say how deep it went (src/stack.rs).
cortex-m-rt = { version = "0.7.5", features = ["paint-stack"] }
# PAC only, no HAL; the device feature comes from the board feature. The
# H745/H755 share the H747 register description (RM0399 covers all four);
# the H753 uses the H753 one for silicon revision V (RM0433).
stm32h7 = "0.15.1"
cortex-m-semihosting = { version = "0.5", optional = true }

# As the root workspace's release profile (root Cargo.toml): default
# opt-level 3, one codegen unit, no LTO (perf/itcm-sections.txt and the
# sizes in docs/perf.md are measured that way).
[profile.release]
debug = "line-tables-only"
codegen-units = 1
