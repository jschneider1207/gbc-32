[package]
name = "h7-bench"
description = "NUCLEO-H753ZI measurement spike: Cortex-M7 cycles per emulated frame"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

# Not a member of the root workspace: it only builds for thumbv7em and has
# its own profile and rustflags (.cargo/config.toml). `host/` (the expected
# hashes, built for the PC) is a third workspace for the same reason.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
# The board images link the gbc-nucleo-h753 lib for their bring-up (ADR
# 0036): supply, the 472 MHz HSI clock (plan D11), UART, MPU, caches, the
# TCM copy, the cycle counter, the fault handlers and the QSPI window (the
# bench pack); gbc-firmware for the pack's ADR 0037 header. The QEMU image does
# not (`--no-default-features --features qemu`).
default = ["board"]
board = ["dep:gbc-nucleo-h753", "dep:gbc-firmware"]
# Placement (README "Placements"). None: code in flash, data in AXI SRAM.
# Stack, statics and the core's lookup tables in DTCM.
dtcm = []
# The hot set of perf/itcm-sections.txt in ITCM (needs `dtcm`).
itcm = ["dtcm"]
# Board bring-up only: the lib's init and banner, the cycle counter and a
# TCM probe. No emulator.
selftest = []
# Bring-up, then the CPU clock measured against the 32.768 kHz LSE crystal
# (TIM16 input capture; the lib's `clockcheck`). No emulator.
clockcheck = ["selftest"]
# QEMU mps2-an500 smoke run of the frame loop and hashes (semihosting
# output, no board code, so no lib). With `itcm` it also exercises the
# placement.
qemu = ["dep:cortex-m-semihosting", "dep:stm32h7"]

# cortex-m, cortex-m-rt and stm32h7 at the lib's exact versions, so the two
# workspaces cannot resolve them differently (ADR 0036, Consequences).
[dependencies]
gbc-core = { path = "../../crates/gbc-core" }
gbc-nucleo-h753 = { path = "../../crates/gbc-nucleo-h753", optional = true }
# The ADR 0037 image header, for the bench pack in the QSPI NOR (src/pack.rs).
gbc-firmware = { path = "../../crates/gbc-firmware", optional = true }
cortex-m = "=0.7.10"
# `paint-stack`: the startup code fills the unused stack with 0xCCCCCCCC, so
# the report can say how deep it went (the lib's `stack`; src/qemu.rs).
cortex-m-rt = { version = "=0.7.7", features = ["paint-stack"] }
# QEMU only: cortex-m-rt (with the `device` feature the PAC turns on) wants
# the PAC's interrupt vector table, which the board images get via the lib.
stm32h7 = { version = "=0.15.1", features = ["stm32h753v"], optional = true }
cortex-m-semihosting = { version = "0.5", optional = true }

# The memory.x generator (ADR 0036), shared with the firmware image.
[build-dependencies]
memory-x = { path = "../memory-x" }

# As the root workspace's release profile (root Cargo.toml): default
# opt-level 3, one codegen unit, no LTO (perf/itcm-sections.txt and the
# sizes in docs/perf.md are measured that way).
[profile.release]
debug = "line-tables-only"
codegen-units = 1
